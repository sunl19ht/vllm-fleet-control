name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    # CI-only credentials for the disposable database; never use deployment secrets here.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: fleet_control
      DB_USER: fleet_control
      DB_PASSWORD: ci_only_password
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: fleet_control
          POSTGRES_USER: fleet_control
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_control -d fleet_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend and migrate the empty database
        run: ./mvnw -B -ntp -V verify
      - name: Check packaged application and repeated migration
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(target/*.jar)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one executable JAR in target/"
            exit 1
          fi

          java -jar "${jars[0]}" > "$RUNNER_TEMP/backend-startup.log" 2>&1 &
          backend_pid=$!
          cleanup() {
            kill "$backend_pid" 2>/dev/null || true
            wait "$backend_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/actuator/health > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/backend-startup.log"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/actuator/health |
            python3 -c 'import json, sys; data = json.load(sys.stdin); assert data.get("status") == "UP", data; print("Health endpoint: UP")'
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/api/v1/system/info |
            python3 -c 'import json, sys; data = json.load(sys.stdin); assert data.get("application") == "vllm-fleet-control", data; assert isinstance(data.get("stage"), str) and data["stage"].strip(), data; print("System info endpoint: OK")'

          migration_count=$(docker exec "$POSTGRES_CONTAINER" psql -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT count(*) FROM flyway_schema_history WHERE version = '1' AND success = true;")
          if [[ "$migration_count" != 1 ]]; then
            echo "Expected exactly one successful V1 migration; got: $migration_count"
            exit 1
          fi
          echo "V1 migration: recorded once after test and packaged application startup"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - name: Show tool versions
        run: |
          node --version
          pnpm --version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check and build frontend
        run: pnpm run build
