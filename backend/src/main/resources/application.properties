spring.application.name=fleet-control-backend
server.address=127.0.0.1
server.port=8080

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:15432}/${DB_NAME:fleet_control}?connectTimeout=5&socketTimeout=30
spring.datasource.username=${DB_USER:fleet_control}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false

spring.sql.init.mode=never